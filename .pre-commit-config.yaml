repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # both are rewritten by lazy.nvim/LazyVim without a trailing newline
        exclude: ^(lazy-lock|lazyvim)\.json$
      - id: check-yaml
      - id: check-toml
  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.6.0
    hooks:
      - id: stylua
